# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
# Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/onepunch_development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/onepunch_test.sqlite3

# SQLite3 write-ahead log for better concurrent performance in production
# Enable the following options if needed:
production:
  <<: *default
  database: storage/onepunch_production.sqlite3
  # For better performance in production with SQLite
  journal_mode: WAL
  synchronous: NORMAL
  cache_size: -64000
  temp_store: MEMORY