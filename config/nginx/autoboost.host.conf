# Host nginx configuration for autoboost development
# This file should be symlinked to /etc/nginx/sites-enabled/
# Proxies all traffic to the Docker nginx container

# Map configuration for WebSocket
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Main server block for HTTPS
server {
  listen 443 ssl;
  server_name local.autoboost.social-ads.fr;

  ssl_certificate /work/autoboost/config/nginx/ssl/local.autoboost.social-ads.fr/fullchain.pem;
  ssl_certificate_key /work/autoboost/config/nginx/ssl/local.autoboost.social-ads.fr/privkey.pem;
  
  # SSL settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  # Logging
  access_log /var/log/nginx/local.autoboost.access.log;
  error_log /var/log/nginx/local.autoboost.error.log;

  # Upload limits
  client_max_body_size 100M;
  client_body_timeout 60s;
  client_header_timeout 60s;
  keepalive_timeout 300s;
  send_timeout 300s;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-XSS-Protection "1; mode=block";

  # Proxy all traffic to the Docker nginx container on port 9393
  location / {
    proxy_pass http://localhost:7000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Cookie handling for authentication
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
    
    # Pass authentication cookies back to the client
    proxy_cookie_path / /;
    
    # Optimizations for development
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    
    # Connection pooling and error handling
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 86400s;
}

# Redirect HTTP to HTTPS
server {
  listen 80;
  server_name local.autoboost.social-ads.fr;

  # Redirect all HTTP traffic to HTTPS
  return 301 https://$host$request_uri;
}